x-common-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: auraeye_db
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Ho_Chi_Minh

    volumes:
      - pgdata:/var/lib/postgresql/data

    command: >-
      postgres
        -c max_connections=150
        -c shared_buffers=1GB
        -c effective_cache_size=3GB
        -c work_mem=16MB
        -c maintenance_work_mem=256MB
        -c wal_buffers=16MB
        -c checkpoint_completion_target=0.9
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c min_wal_size=1GB
        -c max_wal_size=4GB
        -c log_timezone=Asia/Ho_Chi_Minh
        -c timezone=Asia/Ho_Chi_Minh
        -c idle_in_transaction_session_timeout=30000
        -c statement_timeout=60000
        -c log_min_duration_statement=1000
        -c log_checkpoints=on
        -c log_connections=on
        -c log_disconnections=on

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - internal

    logging: *logging

    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "1.50"
        reservations:
          memory: 1G
          cpus: "0.50"

  api:
    image: ${DOCKER_IMAGE_NAME}:latest
    container_name: auraeye_api
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    env_file:
      - path: .env
        required: true

    ports:
      - "${API_PORT}:8080"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

    networks:
      - internal
      - external

    logging: *logging
    environment:
      - LOKI_URL=http://loki:3100
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.00"
        reservations:
          memory: 1G
          cpus: "1.00"

  web:
    image: ${WEB_IMAGE:-nginx:alpine}
    container_name: auraeye_web
    restart: unless-stopped
    networks:
      - internal
      - external
    logging: *logging

  proxy:
    image: nginx:alpine
    container_name: auraeye_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro # Mount SSL từ Host
      - ./deploy/certbot/www:/var/www/certbot:ro # Thư mục xác thực
    depends_on:
      - api
    networks:
      - internal
      - external
    logging: *logging

  # ── pgAdmin (internal only — access via SSH tunnel) ────────────────
  # Access: ssh -L 5050:localhost:5050 user@vps
  # Then open http://localhost:5050 in your browser
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: auraeye_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_LOGIN_BANNER: "'AuraEyes Database Admin'"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: "10"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    ports:
      - "127.0.0.1:5050:80"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - internal
      - external

    logging: *logging

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

  # ── Monitoring Stack ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: auraeye_prometheus
    restart: unless-stopped
    # environment:
    #   - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/console_templates'
      - '--web.enable-remote-write-receiver'
    networks:
      - internal
    logging: *logging

  loki:
    image: grafana/loki:latest
    container_name: auraeye_loki
    restart: unless-stopped
    # environment:
    #   - TZ=Asia/Ho_Chi_Minh
    # Không cần mở port 3100 ra ngoài vì API và Alloy dùng mạng nội bộ
    volumes:
      - ./deploy/monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - internal
    logging: *logging

  tempo:
    image: grafana/tempo:2.4.1
    container_name: auraeye_tempo
    user: root
    restart: unless-stopped
    # environment:
    #   - TZ=Asia/Ho_Chi_Minh
    # Truy cập nội bộ qua port 4317
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./deploy/monitoring/tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - internal
    logging: *logging

  grafana:
    image: grafana/grafana:latest
    container_name: auraeye_grafana
    restart: unless-stopped
    ports:
      - "3200:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    #   - TZ=Asia/Ho_Chi_Minh
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - internal
      - external
    logging: *logging

  node-exporter:
    image: prom/node-exporter:latest
    container_name: auraeye_node_exporter
    restart: unless-stopped
    # environment:
    #   - TZ=Asia/Ho_Chi_Minh
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - internal
    logging: *logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: auraeye_otel_collector
    restart: unless-stopped
    # environment:
    #   - TZ=Asia/Ho_Chi_Minh
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/monitoring/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - internal
    logging: *logging

  alloy:
    image: grafana/alloy:v1.0.0
    container_name: auraeye_alloy
    restart: unless-stopped
    # environment:
    #   - TZ=Asia/Ho_Chi_Minh
    ports:
      - "12347:12347"
    volumes:
      - ./deploy/monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
    command: [ "run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy" ]
    networks:
      - internal
      - external
    logging: *logging

volumes:
  pgdata:
    name: auraeye_pgdata
  pgadmin_data:
    name: auraeye_pgadmin_data
  prometheus_data:
    name: auraeye_prometheus_data
  grafana_data:
    name: auraeye_grafana_data
  tempo_data:
    name: auraeye_tempo_data

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge