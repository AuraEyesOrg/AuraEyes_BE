name: SonarQube Quality Gate & Jira Automation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sonar:
    runs-on: ubuntu-latest
    outputs:
      severe_count: ${{ steps.evaluate.outputs.severe_count }}
      quality_gate: ${{ steps.evaluate.outputs.quality_gate }}
      report_url: ${{ steps.evaluate.outputs.report_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for SonarQube to analyze correctly

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore AuraEyes_BE.sln

      - name: SonarQube - Begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"${{ secrets.SONAR_PROJECT_KEY }}" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /o:"${{ secrets.SONAR_ORGANIZATION }}"

      - name: Build solution
        run: dotnet build AuraEyes_BE.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test AuraEyes_BE.sln --configuration Release --no-build --logger trx --results-directory ./test-results

      - name: SonarQube - End
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Evaluate Sonar severity and quality gate
        if: always()
        id: evaluate
        shell: bash
        run: |
          # Get severe issues count
          SEVERE=$(curl -s -u "${{ secrets.SONAR_TOKEN }}": \
            "${{ secrets.SONAR_HOST_URL }}/api/issues/search?componentKeys=${{ secrets.SONAR_PROJECT_KEY }}&severities=BLOCKER,CRITICAL&resolved=false&ps=1" | jq -r '.total // 0')

          # Get quality gate status (PR-specific for pull_request events)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            QG=$(curl -s -u "${{ secrets.SONAR_TOKEN }}": \
              "${{ secrets.SONAR_HOST_URL }}/api/qualitygates/project_status?projectKey=${{ secrets.SONAR_PROJECT_KEY }}&pullRequest=${{ github.event.pull_request.number }}" | jq -r '.projectStatus.status // "UNKNOWN"')
            REPORT_URL="${{ secrets.SONAR_HOST_URL }}/dashboard?id=${{ secrets.SONAR_PROJECT_KEY }}&pullRequest=${{ github.event.pull_request.number }}"
          else
            QG=$(curl -s -u "${{ secrets.SONAR_TOKEN }}": \
              "${{ secrets.SONAR_HOST_URL }}/api/qualitygates/project_status?projectKey=${{ secrets.SONAR_PROJECT_KEY }}&branch=${{ github.ref_name }}" | jq -r '.projectStatus.status // "UNKNOWN"')
            REPORT_URL="${{ secrets.SONAR_HOST_URL }}/dashboard?id=${{ secrets.SONAR_PROJECT_KEY }}&branch=${{ github.ref_name }}"
          fi

          echo "severe_count=$SEVERE" >> "$GITHUB_OUTPUT"
          echo "quality_gate=$QG" >> "$GITHUB_OUTPUT"
          echo "report_url=$REPORT_URL" >> "$GITHUB_OUTPUT"

          echo "📊 **Sonar Quality Gate Report**"
          echo "- Severe Issues: $SEVERE"
          echo "- Quality Gate: $QG"
          echo "- Report: $REPORT_URL"

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const severeRaw = "${{ steps.evaluate.outputs.severe_count }}";
            const severe = Number.parseInt(severeRaw || "0", 10) || 0;
            const qg = "${{ steps.evaluate.outputs.quality_gate }}" || "UNKNOWN";
            const reportUrl = "${{ steps.evaluate.outputs.report_url }}" || "";

            let icon = qg === "OK" ? "✅" : "❌";
            let bugBadge = severe > 0 ? `🐛 **${severe} Bugs Found**` : "✨ No Critical Issues";
            const statusLine = qg === "OK"
              ? "✨ All quality checks passed!"
              : `⚠️ Quality Gate is ${qg}. ${severe} severe issues detected.`;
            const comment = [
              `## ${icon} SonarQube Quality Gate Results`,
              "",
              `**Quality Gate:** ${qg}`,
              `**Severe Issues:** ${bugBadge}`,
              `**Report:** [View in SonarQube](${reportUrl})`,
              "",
              statusLine
            ].join("\n");

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  create_jira_ticket:
    runs-on: ubuntu-latest
    needs: sonar
    if: ${{ always() && needs.sonar.result == 'success' }}
    steps:
      - name: Fetch Sonar issues and create Jira tickets
        shell: bash
        run: |
          set -e

          SONAR_HOST="${{ secrets.SONAR_HOST_URL }}"
          SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}"
          SONAR_KEY="${{ secrets.SONAR_PROJECT_KEY }}"
          JIRA_URL="${{ secrets.JIRA_BASE_URL }}"
          JIRA_USER="${{ secrets.JIRA_EMAIL }}"
          JIRA_TOKEN="${{ secrets.JIRA_API_TOKEN }}"
          JIRA_PROJECT="${{ secrets.JIRA_PROJECT_KEY }}"
          REPORT_URL="${{ needs.sonar.outputs.report_url }}"
          QG="${{ needs.sonar.outputs.quality_gate }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SONAR_SCOPE="pullRequest=${{ github.event.pull_request.number }}"
          else
            SONAR_SCOPE="branch=${{ github.ref_name }}"
          fi

          # Validate required secrets
          if [ -z "$SONAR_HOST" ] || [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_KEY" ] || [ -z "$JIRA_TOKEN" ]; then
            echo "❌ Missing required secrets. Please set SONAR_HOST_URL, SONAR_TOKEN, SONAR_PROJECT_KEY, JIRA_API_TOKEN."
            exit 1
          fi

          # Normalize host URL to avoid accidental double slashes
          SONAR_HOST="${SONAR_HOST%/}"

          fetch_sonar_json() {
            local endpoint="$1"
            local response
            response=$(curl -sS --fail-with-body -u "$SONAR_TOKEN:" "$SONAR_HOST$endpoint" 2>&1) || {
              echo "❌ Sonar API call failed: $SONAR_HOST$endpoint"
              echo "$response"
              return 1
            }
            echo "$response"
          }

          # Validate Sonar token early
          AUTH_CHECK=$(fetch_sonar_json "/api/authentication/validate") || exit 1
          if [ "$(echo "$AUTH_CHECK" | jq -r '.valid // false')" != "true" ]; then
            echo "❌ SONAR_TOKEN is invalid or lacks permissions."
            echo "Response: $AUTH_CHECK"
            exit 1
          fi

          # Fetch issues
          echo "📊 Fetching issues..."
          ISSUES=$(fetch_sonar_json "/api/issues/search?componentKeys=$SONAR_KEY&resolved=false&ps=500&$SONAR_SCOPE") || exit 1
          HOTSPOTS=$(fetch_sonar_json "/api/hotspots/search?projectKey=$SONAR_KEY&status=TO_REVIEW&ps=500&$SONAR_SCOPE") || exit 1

          if ! echo "$ISSUES" | jq -e '.issues' >/dev/null 2>&1; then
            echo "⚠️ Sonar API did not return issues array. Response:"
            echo "$ISSUES"
            exit 1
          else
            BLOCKER=$(echo "$ISSUES" | jq -r '[.issues[]? | select(.severity=="BLOCKER")] | length')
            CRITICAL=$(echo "$ISSUES" | jq -r '[.issues[]? | select(.severity=="CRITICAL")] | length')
            MAJOR=$(echo "$ISSUES" | jq -r '[.issues[]? | select(.severity=="MAJOR")] | length')
          fi

          if ! echo "$HOTSPOTS" | jq -e '.hotspots' >/dev/null 2>&1; then
            echo "⚠️ Sonar API did not return hotspots array. Response:"
            echo "$HOTSPOTS"
            exit 1
          else
            HOTSPOT_COUNT=$(echo "$HOTSPOTS" | jq -r '[.hotspots[]?] | length')
          fi

          BLOCKER=${BLOCKER:-0}
          CRITICAL=${CRITICAL:-0}
          MAJOR=${MAJOR:-0}
          HOTSPOT_COUNT=${HOTSPOT_COUNT:-0}
          TOTAL=$((BLOCKER + CRITICAL + MAJOR + HOTSPOT_COUNT))

          echo "Issues: BLOCKER=$BLOCKER, CRITICAL=$CRITICAL, MAJOR=$MAJOR, HOTSPOTS=$HOTSPOT_COUNT (Total=$TOTAL)"

          if [ "$TOTAL" -lt 1 ] && [ "$QG" = "OK" ]; then
            echo "✨ No blocking issues. Skipping."
            exit 0
          fi

          # Check existing parent
          echo "🔍 Checking for existing parent ticket..."
          parent_key=$(curl -s -u "$JIRA_USER:$JIRA_TOKEN" \
            "$JIRA_URL/rest/api/2/search?jql=project%3D$JIRA_PROJECT%20AND%20summary~%22%5BSonar%5D%22%20AND%20issuetype%3DBug%20AND%20statusCategory!=Done%20ORDER%20BY%20created%20DESC&maxResults=1" | jq -r '.issues[0].key // empty')

          if [ ! -z "$parent_key" ]; then
            echo "✓ Using existing parent: $parent_key"
          else
            # Create parent
            echo "🎫 Creating new parent ticket..."
            parent_payload=$(jq -n \
              --arg project "$JIRA_PROJECT" \
              --arg summary "🐛 [Sonar] Quality Gate Failed - Multiple Issues Detected" \
              --arg desc "Quality Gate: $QG\nBLOCKER: $BLOCKER | CRITICAL: $CRITICAL | MAJOR: $MAJOR | HOTSPOTS: $HOTSPOT_COUNT\n\nReport: $REPORT_URL\nGitHub Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{"fields":{"project":{"key":$project},"summary":$summary,"description":$desc,"issuetype":{"name":"Bug"},"priority":{"name":"High"}}}')
            
            parent_resp=$(curl -s -X POST -u "$JIRA_USER:$JIRA_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$parent_payload" \
              "$JIRA_URL/rest/api/2/issue")
            
            parent_key=$(echo "$parent_resp" | jq -r '.key // empty')
            if [ -z "$parent_key" ]; then
              echo "❌ Failed to create parent: $parent_resp"
              exit 1
            fi
            echo "✅ Created parent: $parent_key"
          fi

          # Create BLOCKER subtasks (top 5)
          if [ "$BLOCKER" -gt 0 ]; then
            echo "🔴 Creating BLOCKER subtasks (max 5)..."
            echo "$ISSUES" | jq -c '.issues[] | select(.severity=="BLOCKER")' | head -5 | while read -r issue; do
              msg=$(echo "$issue" | jq -r '.message')
              rule=$(echo "$issue" | jq -r '.rule // "Unknown"')
              file=$(echo "$issue" | jq -r '.component // "Unknown"')
              line=$(echo "$issue" | jq -r '.line // "N/A"')
              
              payload=$(jq -n \
                --arg project "$JIRA_PROJECT" \
                --arg summary "🐛 BLOCKER: ${msg:0:50}" \
                --arg desc "**File:** $file (Line $line)\n**Rule:** $rule\n**Report:** $REPORT_URL" \
                --arg parent "$parent_key" \
                '{"fields":{"project":{"key":$project},"summary":$summary,"description":$desc,"issuetype":{"name":"Sub-task"},"priority":{"name":"Highest"},"parent":{"key":$parent}}}')
              
              sub_resp=$(curl -s -X POST -u "$JIRA_USER:$JIRA_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$payload" \
                "$JIRA_URL/rest/api/2/issue")
              sub_key=$(echo "$sub_resp" | jq -r '.key // empty')
              
              if [ ! -z "$sub_key" ]; then
                echo "  ✅ $sub_key - $msg"
              else
                echo "  ❌ Failed to create: $msg"
                echo "     Jira response: $sub_resp"
              fi
            done
          fi

          # Create CRITICAL subtasks (top 5)
          if [ "$CRITICAL" -gt 0 ]; then
            echo "🟠 Creating CRITICAL subtasks (max 5)..."
            echo "$ISSUES" | jq -c '.issues[] | select(.severity=="CRITICAL")' | head -5 | while read -r issue; do
              msg=$(echo "$issue" | jq -r '.message')
              rule=$(echo "$issue" | jq -r '.rule // "Unknown"')
              file=$(echo "$issue" | jq -r '.component // "Unknown"')
              line=$(echo "$issue" | jq -r '.line // "N/A"')
              
              payload=$(jq -n \
                --arg project "$JIRA_PROJECT" \
                --arg summary "⚠️ CRITICAL: ${msg:0:50}" \
                --arg desc "**File:** $file (Line $line)\n**Rule:** $rule\n**Report:** $REPORT_URL" \
                --arg parent "$parent_key" \
                '{"fields":{"project":{"key":$project},"summary":$summary,"description":$desc,"issuetype":{"name":"Sub-task"},"priority":{"name":"High"},"parent":{"key":$parent}}}')
              
              sub_resp=$(curl -s -X POST -u "$JIRA_USER:$JIRA_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$payload" \
                "$JIRA_URL/rest/api/2/issue")
              sub_key=$(echo "$sub_resp" | jq -r '.key // empty')
              
              if [ ! -z "$sub_key" ]; then
                echo "  ✅ $sub_key - $msg"
              else
                echo "  ❌ Failed to create: $msg"
                echo "     Jira response: $sub_resp"
              fi
            done
          fi

          # Create MAJOR subtasks (top 3)
          if [ "$MAJOR" -gt 0 ]; then
            echo "🟡 Creating MAJOR subtasks (max 3)..."
            echo "$ISSUES" | jq -c '.issues[] | select(.severity=="MAJOR")' | head -3 | while read -r issue; do
              msg=$(echo "$issue" | jq -r '.message')
              rule=$(echo "$issue" | jq -r '.rule // "Unknown"')
              file=$(echo "$issue" | jq -r '.component // "Unknown"')
              line=$(echo "$issue" | jq -r '.line // "N/A"')
              
              payload=$(jq -n \
                --arg project "$JIRA_PROJECT" \
                --arg summary "📌 MAJOR: ${msg:0:50}" \
                --arg desc "**File:** $file (Line $line)\n**Rule:** $rule\n**Report:** $REPORT_URL" \
                --arg parent "$parent_key" \
                '{"fields":{"project":{"key":$project},"summary":$summary,"description":$desc,"issuetype":{"name":"Sub-task"},"priority":{"name":"Medium"},"parent":{"key":$parent}}}')
              
              sub_resp=$(curl -s -X POST -u "$JIRA_USER:$JIRA_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$payload" \
                "$JIRA_URL/rest/api/2/issue")
              sub_key=$(echo "$sub_resp" | jq -r '.key // empty')
              
              if [ ! -z "$sub_key" ]; then
                echo "  ✅ $sub_key - $msg"
              else
                echo "  ❌ Failed to create: $msg"
                echo "     Jira response: $sub_resp"
              fi
            done
          fi

          # Create HOTSPOT subtasks (top 5)
          if [ "$HOTSPOT_COUNT" -gt 0 ]; then
            echo "🛡️ Creating HOTSPOT subtasks (max 5)..."
            echo "$HOTSPOTS" | jq -c '.hotspots[]' | head -5 | while read -r hotspot; do
              msg=$(echo "$hotspot" | jq -r '.message // "Security hotspot requires review"')
              file=$(echo "$hotspot" | jq -r '.component // "Unknown"')
              line=$(echo "$hotspot" | jq -r '.line // "N/A"')
              prob=$(echo "$hotspot" | jq -r '.vulnerabilityProbability // "MEDIUM"')

              payload=$(jq -n \
                --arg project "$JIRA_PROJECT" \
                --arg summary "🐛 HOTSPOT: ${msg:0:45}" \
                --arg desc "**File:** $file (Line $line)\n**Risk:** $prob\n**Report:** $REPORT_URL" \
                --arg parent "$parent_key" \
                '{"fields":{"project":{"key":$project},"summary":$summary,"description":$desc,"issuetype":{"name":"Sub-task"},"priority":{"name":"High"},"parent":{"key":$parent}}}')

              sub_resp=$(curl -s -X POST -u "$JIRA_USER:$JIRA_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$payload" \
                "$JIRA_URL/rest/api/2/issue")
              sub_key=$(echo "$sub_resp" | jq -r '.key // empty')

              if [ ! -z "$sub_key" ]; then
                echo "  ✅ $sub_key - $msg"
              else
                echo "  ❌ Failed to create HOTSPOT: $msg"
                echo "     Jira response: $sub_resp"
              fi
            done
          fi

          echo ""
          echo "🎯 Done! Parent: $parent_key"
          echo "URL: $JIRA_URL/browse/$parent_key"
