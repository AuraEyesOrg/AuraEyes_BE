name: BE Quality & Security

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'AuraEyes_BE.sln'
      - '.github/workflows/be-quality-security.yml'
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'AuraEyes_BE.sln'
      - '.github/workflows/be-quality-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-check:
    name: .NET Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore solution
        run: dotnet restore AuraEyes_BE.sln

      - name: Verify formatting
        run: |
          mkdir -p reports
          dotnet format AuraEyes_BE.sln --verify-no-changes --verbosity minimal --report reports/dotnet-format-report.json

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: be-format-scan-reports
          path: reports/*
          if-no-files-found: warn

  vulnerability-scan:
    name: NuGet Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            global.json

      - name: Restore solution
        run: dotnet restore AuraEyes_BE.sln

      - name: Scan vulnerable packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          dotnet list AuraEyes_BE.sln package --vulnerable --include-transitive | tee reports/nuget-vulnerability-report.txt

          if grep -qi "has the following vulnerable packages" reports/nuget-vulnerability-report.txt; then
            echo "Detected vulnerable NuGet packages."
            exit 1
          fi

          echo "No vulnerable NuGet packages found."

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: be-security-scan-reports
          path: reports/*
          if-no-files-found: warn

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4