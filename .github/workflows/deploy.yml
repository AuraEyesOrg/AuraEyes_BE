name: Deploy Aura Eyes API (Production)

on:
  workflow_run:
    workflows: ["Build & Push Aura Eyes API Image"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted
    timeout-minutes: 10

    env:
      DEPLOY_DIR: /dulieu/phuoc/AuraEyes
      API_PORT: 5060

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Setup Deploy Folder
        run: |
          mkdir -p "$DEPLOY_DIR"
          cp docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"
      
      - name: Create .env file
        run: |
          cat > "$DEPLOY_DIR/.env" << 'EOF'
          ASPNETCORE_ENVIRONMENT=Production
          ASPNETCORE_URLS=http://0.0.0.0:8080

          ConnectionStrings__DefaultConnection=${{ secrets.SUPABASE_CONNECTION_STRING }}

          JwtSettings__SecretKey=${{ secrets.JWT_SECRET_KEY }}
          JwtSettings__Issuer=${{ secrets.JWT_ISSUER }}
          JwtSettings__Audience=${{ secrets.JWT_AUDIENCE }}
          JwtSettings__AccessTokenExpiryMinutes=${{ secrets.JWT_ACCESS_TOKEN_EXPIRY_MINUTES }}
          JwtSettings__RefreshTokenExpiryDays=${{ secrets.JWT_REFRESH_TOKEN_EXPIRY_DAYS }}
          JwtSettings__ClockSkewSeconds=30

          Smtp__Host=smtp.gmail.com
          Smtp__Port=587
          Smtp__Username=${{ secrets.SMTP_USERNAME }}
          Smtp__Password=${{ secrets.SMTP_PASSWORD }}
          Smtp__FromEmail=${{ secrets.SMTP_FROM_EMAIL }}
          Smtp__FromName=Aura Eyes Support
          Smtp__UseSsl=false
          Smtp__UseStartTls=true

          Cors__AllowedOrigins__0=${{ secrets.FRONTEND_URL }}

          Swagger__Username=${{ secrets.SWAGGER_USERNAME }}
          Swagger__Password=${{ secrets.SWAGGER_PASSWORD }}

          PayOS__ClientId=${{ secrets.PAYOS_CLIENT_ID }}
          PayOS__ApiKey=${{ secrets.PAYOS_API_KEY }}
          PayOS__ChecksumKey=${{ secrets.PAYOS_CHECKSUM_KEY }}
          PayOS__DefaultReturnUrl=${{ secrets.PAYOS_DEFAULT_RETURN_URL }}
          PayOS__DefaultCancelUrl=${{ secrets.PAYOS_DEFAULT_CANCEL_URL }}

          SupabaseStorage__Url=${{ secrets.SUPABASE_STORAGE_URL }}
          SupabaseStorage__ServiceKey=${{ secrets.SUPABASE_STORAGE_KEY }}
          SupabaseStorage__BucketName=${{ secrets.SUPABASE_STORAGE_BUCKET }}

          GoogleAuth__ClientId=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GoogleMeet__ClientId=${{ secrets.GOOGLE_MEET_CLIENT_ID }}
          GoogleMeet__ClientSecret=${{ secrets.GOOGLE_MEET_CLIENT_SECRET }}
          GoogleMeet__RefreshToken=${{ secrets.GOOGLE_MEET_REFRESH_TOKEN }}
          GoogleMeet__CalendarId=primary
          GoogleMeet__ApplicationName=AURA Telemedicine
          GoogleMeet__DefaultDurationMinutes=30

          AdminNotifications__OrganisationOnboardingEmail=${{ secrets.ADMIN_NOTIFICATIONS_EMAIL }}

          SerpApi__ApiKey=${{ secrets.SERPAPI_KEY }}
          SerpApi__BaseUrl=https://serpapi.com/search.json

          GoogleAiStudio__ApiKey=${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}

          BetterStack__Dashboard__EmbedUrl=https://status.auraeyes.site

          BetterStack__Heartbeats__DailyQuotaReset__PingUrl=https://uptime.betterstack.com/api/v1/heartbeat/${{ secrets.BETTERSTACK_HEARTBEATS_DAILY_QUOTA_RESET_KEY_URL }}
          BetterStack__Heartbeats__DailyQuotaReset__StartUrl=https://uptime.betterstack.com/api/v1/heartbeat/${{ secrets.BETTERSTACK_HEARTBEATS_DAILY_QUOTA_RESET_KEY_URL }}/start
          BetterStack__Heartbeats__DailyQuotaReset__FailUrl=https://uptime.betterstack.com/api/v1/heartbeat/${{ secrets.BETTERSTACK_HEARTBEATS_DAILY_QUOTA_RESET_KEY_URL }}/fail

          BetterStack__Heartbeats__SlotMaintenance__PingUrl=https://uptime.betterstack.com/api/v1/heartbeat/${{ secrets.BETTERSTACK_HEARTBEATS_SLOT_MAINTENANCE_KEY_URL }}
          BetterStack__Heartbeats__SlotMaintenance__StartUrl=https://uptime.betterstack.com/api/v1/heartbeat/${{ secrets.BETTERSTACK_HEARTBEATS_SLOT_MAINTENANCE_KEY_URL }}/start
          BetterStack__Heartbeats__SlotMaintenance__FailUrl=https://uptime.betterstack.com/api/v1/heartbeat/${{ secrets.BETTERSTACK_HEARTBEATS_SLOT_MAINTENANCE_KEY_URL }}/fail

          BetterStack__Heartbeats__SessionReminderWorker__PingUrl=https://uptime.betterstack.com/api/v1/heartbeat/${{ secrets.BETTERSTACK_HEARTBEATS_SESSION_REMINDER_WORKER_KEY_URL }}
          BetterStack__Heartbeats__SessionReminderWorker__StartUrl=https://uptime.betterstack.com/api/v1/heartbeat/${{ secrets.BETTERSTACK_HEARTBEATS_SESSION_REMINDER_WORKER_KEY_URL }}/start
          BetterStack__Heartbeats__SessionReminderWorker__FailUrl=https://uptime.betterstack.com/api/v1/heartbeat/${{ secrets.BETTERSTACK_HEARTBEATS_SESSION_REMINDER_WORKER_KEY_URL }}/fail

          BetterStack__Heartbeats__ReservationExpirationWorker__PingUrl=https://uptime.betterstack.com/api/v1/heartbeat/${{ secrets.BETTERSTACK_HEARTBEATS_RESERVATION_EXPIRATION_WORKER_KEY_URL }}
          BetterStack__Heartbeats__ReservationExpirationWorker__StartUrl=https://uptime.betterstack.com/api/v1/heartbeat/${{ secrets.BETTERSTACK_HEARTBEATS_RESERVATION_EXPIRATION_WORKER_KEY_URL }}/start
          BetterStack__Heartbeats__ReservationExpirationWorker__FailUrl=https://uptime.betterstack.com/api/v1/heartbeat/${{ secrets.BETTERSTACK_HEARTBEATS_RESERVATION_EXPIRATION_WORKER_KEY_URL }}/fail

          BetterStack__Heartbeats__ConsultationStateWorker__PingUrl=https://uptime.betterstack.com/api/v1/heartbeat/${{ secrets.BETTERSTACK_HEARTBEATS_CONSULTATION_STATE_WORKER_KEY_URL }}
          BetterStack__Heartbeats__ConsultationStateWorker__StartUrl=https://uptime.betterstack.com/api/v1/heartbeat/${{ secrets.BETTERSTACK_HEARTBEATS_CONSULTATION_STATE_WORKER_KEY_URL }}/start
          BetterStack__Heartbeats__ConsultationStateWorker__FailUrl=https://uptime.betterstack.com/api/v1/heartbeat/${{ secrets.BETTERSTACK_HEARTBEATS_CONSULTATION_STATE_WORKER_KEY_URL }}/fail

          Hangfire__ServerEnabled=true
          Hangfire__WorkerCount=1

          AiAsset__BaseUrl=${{ secrets.AI_BASE_URL }}

          API_PORT=${API_PORT}
          BaseUrl=${{ secrets.FRONTEND_URL }}

          DOCKER_IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/auraeyes-api
          EOF

      - name: Pull & run containers
        run: |
          docker compose --env-file "$DEPLOY_DIR/.env" -f "$DEPLOY_DIR/docker-compose.yml" pull
          docker compose --env-file "$DEPLOY_DIR/.env" -f "$DEPLOY_DIR/docker-compose.yml" up -d

      - name: Health check
        run: |
          for i in {1..60}; do
            if curl -fs "http://localhost:${API_PORT}/health"; then
              echo "✅ API healthy"
              exit 0
            fi
            sleep 2
          done

          echo "❌ Health check failed"
          docker compose --env-file "$DEPLOY_DIR/.env" -f "$DEPLOY_DIR/docker-compose.yml" ps
          docker compose --env-file "$DEPLOY_DIR/.env" -f "$DEPLOY_DIR/docker-compose.yml" logs --tail=200
          exit 1

      - name: Cleanup unused Docker images
        if: success()
        run: |
          echo "🧹 Cleaning up unused Docker images..."

          # Remove dangling images
          docker image prune -f

          # Remove unused images older than 7 days
          docker image prune -a -f --filter "until=168h"
          echo "✅ Docker image cleanup completed"
