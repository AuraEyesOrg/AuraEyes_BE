global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Khôi phục lại quét trực tiếp API .NET (Để Dashboard 19924/17706 có data ngay)
  - job_name: 'auraeyes-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8080']

  # Quét OTel Collector để lấy các metrics hệ thống khác
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
