global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'auraeyes-api'
    static_configs:
      - targets: ['api:8080']
    metric_relabel_configs:
      # Map lại các metric process để khớp với Dashboard cũ
      - source_labels: [__name__]
        regex: 'process_runtime_dotnet_thread_pool_thread_count'
        target_label: __name__
        replacement: 'process_threads'

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:12345']

  - job_name: 'vps-nodes'
    static_configs:
      - targets: ['node-exporter:9100']
