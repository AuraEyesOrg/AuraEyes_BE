# Nginx Configuration for AuraEyes Portal
# Domain: web.auraeyes.site
# Purpose: Serve Frontend and Reverse Proxy to Backend API

server {
    listen 80;
    server_name web.auraeyes.site;
    
    # "Ô cửa" dành riêng cho Certbot xác thực domain
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect tất cả các request khác sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name web.auraeyes.site;

    # SSL Configuration (assuming Certbot/LetsEncrypt on Host)
    ssl_certificate /etc/letsencrypt/live/web.auraeyes.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.auraeyes.site/privkey.pem;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # 1. Reverse Proxy for Backend API (Ưu tiên cao nhất)
    location ~* ^/(?:[a-z]{2}/)?api {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Frontend Logic: Proxy to 'web' container
    location / {
        proxy_pass http://web:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error Pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
