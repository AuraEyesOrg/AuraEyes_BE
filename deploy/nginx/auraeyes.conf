# ── BLOCK PORT 80: HTTP TO HTTPS & CERTBOT ──────────────────────────────────
server {
    listen 80;
    server_name web.auraeyes.site;

    # Ưu tiên cao nhất cho Certbot xác thực SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Chuyển hướng mọi request khác sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── BLOCK PORT 443: HTTPS, API, SIGNALR & REACT ──────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name web.auraeyes.site;

    # Đường dẫn chứng chỉ (Đã mount từ Host vào Container)
    ssl_certificate /etc/letsencrypt/live/web.auraeyes.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.auraeyes.site/privkey.pem;
    
    # Tối ưu cho việc upload ảnh y tế (Dự án AURA)
    client_max_body_size 50M;

    # Security headers chuẩn chỉnh
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Hỗ trợ xác thực SSL ngay cả trên cổng 443 (phòng hờ Cloudflare redirect)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 1. API PROXY (.NET Backend)
    location /api {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cấu hình cực kỳ quan trọng cho SignalR / WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeout dài hơn cho các tác vụ AI xử lý ảnh lâu
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # 2. FRONTEND PROXY (React SPA)
    
    # 2.1. Không cache các file định danh (index, service worker)
    location ~* (sw\.js|service-worker\.js|index\.html|workbox-.*\.js)$ {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # 2.2. Cache mạnh cho tài sản tĩnh (js, css, images có hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # 2.3. Mặc định (SPA routing)
    location / {
        proxy_pass http://web:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Đảm bảo index.html trả về cho SPA luôn mới nhất
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # 3. Loại bỏ log rác từ Vercel
    location /_vercel {
        return 204;
    }
}