server {
    listen 80;
    server_name web.auraeyes.site;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name web.auraeyes.site;

    ssl_certificate /etc/letsencrypt/live/web.auraeyes.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.auraeyes.site/privkey.pem;
    
    # Increase upload size limit
    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # 1. API Proxy (Xử lý mọi request bắt đầu bằng /api)
    location /api {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Support for SignalR/WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 2. Frontend Proxy (Xử lý tất cả các request còn lại)
    
    # 2.1. Cấu hình không cache cho index.html và service worker
    location ~* (sw\.js|service-worker\.js|index\.html|workbox-.*\.js)$ {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # 2.2. Cấu hình cache lâu cho các file static (có hash trong tên file)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # 2.3. Mặc định (SPA routing) - Không cache để index.html luôn mới
    location / {
        proxy_pass http://web:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Quan trọng: Không cache file index.html được trả về từ route SPA
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # 3. Silence Vercel Analytics noise on VPS
    location /_vercel {
        return 204;
    }
}
